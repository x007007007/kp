[package]
name = "kp-cli"
version = "0.2.1"
edition = "2021"
description = "kp — keep processes running: transparent command wrapping with session dedup, re-attach, and a built-in PTY engine (tmux optional)"
license = "MIT"
repository = "https://github.com/x007007007/kp"
readme = "README.md"
keywords = ["cli", "tmux", "terminal", "process", "devtools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "kp_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"

[[bin]]
name = "kp"
path = "src/bin/kp.rs"

[[bin]]
name = "kpm"
path = "src/bin/kpm.rs"
