name: release

# 打 tag v* 触发：产出 macOS 双架构 / Linux 双架构 tar.gz、universal DMG、
# sha256sums.txt，并自动创建 GitHub Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN_NAME: kp
  APPS: "kp kpm"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build (both arches)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
      - name: Per-arch tarballs
        run: |
          VER="${GITHUB_REF_NAME#v}"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            d="stage-$t"; mkdir -p "$d"
            cp "target/$t/release/kp" "target/$t/release/kpm" README.md LICENSE "$d/"
            tar czf "kp-cli-$VER-$t.tar.gz" -C "$d" .
          done
      - name: Universal DMG
        run: |
          VER="${GITHUB_REF_NAME#v}"
          d="stage-dmg/kp-installer"; mkdir -p "$d"
          lipo -create \
            -output "$d/kp" \
            target/aarch64-apple-darwin/release/kp target/x86_64-apple-darwin/release/kp
          lipo -create \
            -output "$d/kpm" \
            target/aarch64-apple-darwin/release/kpm target/x86_64-apple-darwin/release/kpm
          cp README.md LICENSE "$d/"
          cat > "$d/install.sh" <<'EOS'
          #!/bin/sh
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST=/usr/local/bin
          [ -w /usr/local/bin ] || DEST="$HOME/.local/bin"
          mkdir -p "$DEST"
          install -m 755 "$DIR/kp" "$DEST/kp"
          install -m 755 "$DIR/kpm" "$DEST/kpm"
          echo "✓ 已安装到 $DEST（kp, kpm）"
          command -v tmux >/dev/null 2>&1 || echo "⚠ 还需要 tmux：brew install tmux"
          EOS
          chmod +x "$d/install.sh"
          hdiutil create -volname "kp" -srcfolder stage-dmg -ov -format UDZO "kp-installer-$VER.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            kp-cli-*-apple-darwin.tar.gz
            kp-installer-*.dmg
          if-no-files-found: error

  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build (static musl)
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --target x86_64-unknown-linux-musl
      - name: Tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          d="stage"; mkdir -p "$d"
          cp target/x86_64-unknown-linux-musl/release/kp target/x86_64-unknown-linux-musl/release/kpm README.md LICENSE "$d/"
          tar czf "kp-cli-${VER}-x86_64-unknown-linux-musl.tar.gz" -C "$d" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: kp-cli-*-musl.tar.gz
          if-no-files-found: error

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Build (static musl)
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --target aarch64-unknown-linux-musl
      - name: Tarball
        run: |
          VER="${GITHUB_REF_NAME#v}"
          d="stage"; mkdir -p "$d"
          cp target/aarch64-unknown-linux-musl/release/kp target/aarch64-unknown-linux-musl/release/kpm README.md LICENSE "$d/"
          tar czf "kp-cli-${VER}-aarch64-unknown-linux-musl.tar.gz" -C "$d" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: kp-cli-*-musl.tar.gz
          if-no-files-found: error

  release:
    needs: [macos, linux-x86_64, linux-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums + Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.dmg" \) -exec mv {} . \;
          ls -l
          sha256sum kp-cli-*.tar.gz kp-installer-*.dmg > sha256sums.txt
          gh release create "$GITHUB_REF_NAME" \
            kp-cli-*.tar.gz kp-installer-*.dmg sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "kp $GITHUB_REF_NAME" \
            --notes "kp / kpm 预编译产物。

          - macOS：解压后 \`sudo ./install.sh\`（或拖入 PATH）；依赖 tmux（\`brew install tmux\`）
          - 推荐安装：\`brew tap x007007007/kp && brew install kp\`
          - Linux：解压 tar.gz，把 kp / kpm 放进 PATH
          - 校验：sha256sums.txt"
